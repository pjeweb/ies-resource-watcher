name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, pcntl, posix, pdo_sqlite, sysvsem, intl
          ini-values: ffi.enable=preload
          coverage: none
      # composer.lock pins the versions of the reference installation (Symfony 6.4, Atoolo Search 1.14).
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
